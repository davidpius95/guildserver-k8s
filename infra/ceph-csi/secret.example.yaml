# TEMPLATE ONLY — the real secret is NOT committed (contains a cephx key).
#
# Create the real secret out-of-band with the key from Ceph:
#   KEY=$(ssh root@<mon-node> 'ceph auth get-key client.k8s')
#   kubectl -n ceph-csi create secret generic csi-rbd-secret \
#     --from-literal=userID=k8s \
#     --from-literal=userKey="$KEY"
#
# The cephx user 'client.k8s' is scoped to the k8s-rbd pool only:
#   ceph auth get-or-create client.k8s \
#     mon 'profile rbd' osd 'profile rbd pool=k8s-rbd' mgr 'profile rbd pool=k8s-rbd'
apiVersion: v1
kind: Secret
metadata:
  name: csi-rbd-secret
  namespace: ceph-csi
stringData:
  userID: k8s
  userKey: "<REDACTED — cephx key for client.k8s>"
