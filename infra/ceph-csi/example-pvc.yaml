# Example: a 1Gi Ceph-backed volume and a pod that mounts it.
# NOTE: ceph-rbd is no longer the default class (Longhorn is). This PVC only works
# while Ceph-CSI is still installed and Guild-A is reachable.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ceph-test-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd           # must be explicit; default is now 'longhorn'
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ceph-test-pod
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo hello-from-ceph > /data/proof.txt; sleep 3600"]
      volumeMounts:
        - name: vol
          mountPath: /data
  volumes:
    - name: vol
      persistentVolumeClaim:
        claimName: ceph-test-pvc
