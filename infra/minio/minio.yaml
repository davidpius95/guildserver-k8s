# MinIO — S3-compatible object store used as Velero's backup target.
# Credentials come from the minio-creds Secret (created out-of-band; not in Git).
# NOTE: on-cluster backup target is fine for a demo; real DR sends backups OFF-site.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: minio
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels: {app: minio, owner: guild-platform}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio, owner: guild-platform}
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: minio-creds
          ports:
            - {containerPort: 9000}
            - {containerPort: 9001}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
spec:
  selector: {app: minio}
  ports:
    - {name: api, port: 9000, targetPort: 9000}
    - {name: console, port: 9001, targetPort: 9001}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-mkbucket
  namespace: minio
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: {owner: guild-platform}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          envFrom:
            - secretRef:
                name: minio-creds
          command:
            - sh
            - -c
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do echo waiting for minio; sleep 3; done
              mc mb -p local/velero || true
              mc ls local
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
